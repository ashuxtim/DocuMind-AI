# ─── CONFIGMAP: DocuMind Shared Configuration ──────────────────
# Stores non-sensitive config shared across FastAPI and Celery.
# API keys are NOT stored here — use documind-secrets.
# ────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: documind-config
  labels:
    app: documind
data:
  # ── Service Discovery (K8s DNS names) ──
  REDIS_URL: "redis://redis-service:6379/0"
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
  QDRANT_GRPC_PORT: "6334"

  # ── LLM Providers ──
  # Auto-detect priority (when LLM_PROVIDER=auto):
  #   NVIDIA → GROQ → GEMINI → OPENAI
  # Anthropic is explicit-only — auto-detect will never land on it.

  # ── NVIDIA — serves: primary, audit, router, structured extraction, embedding, reranker ──
  LLM_PROVIDER: "nvidia"
  PRIMARY_MODEL: "meta/llama-3.3-70b-instruct"         # primary
  AUDIT_LLM_PROVIDER: "nvidia"
  AUDIT_MODEL: "mistralai/mistral-small-4-119b-2603"   # audit
  ROUTER_LLM_PROVIDER: "nvidia"
  ROUTER_MODEL: "mistralai/mistral-small-4-119b-2603"  # router
  STRUCTURED_LLM_PROVIDER: "nvidia"
  STRUCTURED_MODEL: "qwen/qwen2.5-coder-32b-instruct"  # structured extraction
  NVIDIA_MODEL: "nvidia/llama-3.3-nemotron-super-49b-v1.5"  # nvidia fallback model
  EMBED_MODEL: "nvidia/nv-embed-v1"
  EMBED_DIM: "4096"                                    # embedding
  RERANK_MODEL: "nvidia/llama-nemotron-rerank-1b-v2"   # reranker
  JUDGE_EMBED_MODEL: "nvidia/nv-embedqa-e5-v5"         # judge embeddings (ragas)

  # ── GOOGLE — serves: judge (ragas eval) ──
  JUDGE_LLM_PROVIDER: "google"
  JUDGE_MODEL: "gemini-2.5-flash"                      # judge llm
  GEMINI_MODEL: "gemini-2.5-flash"                     # google fallback model

  # ── GROQ — serves: fallback only (currently inactive) ──
  GROQ_MODEL: "llama-3.3-70b-versatile"                # groq fallback model

  # ── OTHER PROVIDERS — fallback only, never auto-selected ──
  OPENAI_MODEL: "gpt-4o"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"

  # ── Context Window ──
  # Maximum document context chars passed to the LLM.
  # Default 60K is safe for all providers including Groq (Qwen3-32B: ~24K char budget).
  # Increase for providers with larger context windows:
  #   NVIDIA nemotron-super (NIM API cap 256K tokens): up to ~190K chars
  #   Anthropic Sonnet 4.6 (200K tokens):              up to ~150K chars
  #   Gemini 2.5 Flash (1M tokens):                    up to ~750K chars
  #   Groq Qwen3-32B (32K tokens):                     do not exceed ~20K chars
  AGENT_MAX_CONTEXT_CHARS: "60000"
  QUERY_TIMEOUT_S: "300"

  # ── Retrieval Thresholds ──
  # Tune after re-ingest without code changes.
  # AGENT_MIN_RERANK_SCORE: logit threshold for NVIDIA reranker (-5.0 default)
  # AGENT_MIN_VECTOR_SCORE: cosine similarity threshold for Qdrant (0.30 default)
  AGENT_MIN_RERANK_SCORE: "-15.0"
  AGENT_MIN_VECTOR_SCORE: "0.30"

  # ── MinIO (Object Storage) ──
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_BUCKET: "documind-uploads"
  MINIO_USE_SSL: "false"
  UPLOAD_FOLDER: "./uploads"

  SENTENCE_TRANSFORMERS_HOME: "/model-cache"
  HF_HOME: "/model-cache"
  HF_HUB_OFFLINE: "1"

  # ── Observability ──
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
  LANGCHAIN_PROJECT: "DocuMind_K8s"
