# ─── DEPLOYMENT: Celery Worker ─────────────────────────────────
# Same image as FastAPI, different command.
# Uses same ConfigMap and Secret (shared config).
#
# IMAGE NOTE: image tag must be rebuilt to reflect the API stack
# upgrade (sentence-transformers removed, NVIDIA NIM added).
# Build and load before applying:
#   docker build -t documind-fastapi:v2.0 .
#   minikube image load documind-fastapi:v2.0
# Then update the image field below to match.
# ────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        component: backend
    spec:
      initContainers:
      - name: seed-model-cache
        image: documind-fastapi:v2.0
        env:
        - name: SENTENCE_TRANSFORMERS_HOME
          value: /model-cache
        - name: HF_HOME
          value: /model-cache
        command: [python, -c]
        args:
          - |
              import os
              from pathlib import Path
              cache = Path("/model-cache")
              marker = cache / "bge-small-ready"
              if marker.exists():
                  print("✅ Model cache already seeded, skipping")
              else:
                  print("⏳ First start — seeding model cache...")
                  from sentence_transformers import SentenceTransformer
                  import nltk
                  SentenceTransformer("BAAI/bge-small-en-v1.5")
                  nltk.download("punkt_tab", quiet=True)
                  nltk.download("averaged_perceptron_tagger_eng", quiet=True)
                  marker.touch()
                  print("✅ Model cache seeded")
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
      - name: wait-for-deps
        image: busybox
        command: ['sh', '-c']
        args:
          - until nc -z redis-service 6379 && nc -z qdrant-service 6333 && nc -z neo4j-service 7687; do echo "waiting for deps..."; sleep 2; done
      containers:
      - name: worker
        image: documind-fastapi:v2.0
        imagePullPolicy: Never

        command: ["celery"]
        args:
          - "-A"
          - "celery_app.celery_app"
          - "worker"
          - "--loglevel=info"
          - "--concurrency=1"
          - "--pool=solo"

        envFrom:
        - configMapRef:
            name: documind-config
        - secretRef:
            name: documind-secrets
        - secretRef:
            name: minio-credentials
        env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root_user
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root_password

        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2000m"

        startupProbe:
          exec:
            command:
              - sh
              - -c
              - test -f /tmp/worker-heartbeat
          failureThreshold: 15
          periodSeconds: 20
          timeoutSeconds: 5

        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - |
                test -f /tmp/worker-heartbeat && \
                [ $(( $(date +%s) - $(cat /tmp/worker-heartbeat | cut -d. -f1) )) -lt 120 ]
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 5
          initialDelaySeconds: 0

        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: model-cache
          mountPath: /model-cache

        # model-cache caches bge-small-en-v1.5 (Chonkie) and unstructured
        # vision models across pod restarts via the model-cache PVC.

      volumes:
      - name: uploads
        emptyDir: {}
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
